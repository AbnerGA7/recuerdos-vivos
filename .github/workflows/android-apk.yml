name: Compilar APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Misma versión de Flutter que se usa en desarrollo local.
  FLUTTER_VERSION: 3.47.4

jobs:
  verificar:
    name: Analizar y probar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar el código
        run: flutter analyze

      - name: Ejecutar las pruebas
        run: flutter test

  apk:
    name: Compilar la APK
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Descargar el modelo de voz
        run: bash tool/preparar_voz.sh

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar la APK de release
        run: flutter build apk --release

      - name: Subir la APK
        uses: actions/upload-artifact@v4
        with:
          name: recuerdos-vivos-apk
          path: build/app/outputs/flutter-apk/app-release.apk
