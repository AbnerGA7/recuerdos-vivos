name: recuerdos_vivos
description: App de estimulación cognitiva con fotos personales y voz.
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Descomprimir los datos de pronunciación de la voz neuronal.
  archive: ^4.0.0
  # Reproducir el audio generado por la voz neuronal.
  audioplayers: ^6.1.0
  # Voz de respaldo: texto a voz del teléfono.
  flutter_tts: ^4.2.5
  # Elegir fotos de la galería o tomarlas con la cámara.
  image_picker: ^1.2.0
  # Carpeta privada de la app para guardar fotos y datos.
  path_provider: ^2.1.5
  # Escuchar la respuesta hablada (voz a texto del teléfono).
  speech_to_text: ^7.3.0
  # Voz neuronal local (Piper) que suena natural y funciona sin internet.
  sherpa_onnx: ^1.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/voz/voz.onnx
    - assets/voz/tokens.txt
    - assets/voz/espeak.zip
  fonts:
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fuentes/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fuentes/AtkinsonHyperlegible-Bold.ttf
          weight: 700
